<!DOCTYPE html>
<html>
  <head>
    <title>การผลิต</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <template data-content>
      <div class="content-section">
        <div class="content-header">
          <h1>คู่มือผู้ใช้งานหน้าการผลิต</h1>
        </div>

        <h2>จัดกลุ่มสินค้าเพื่อผลิต</h2>
        <p>การจัดกลุ่มสินค้าเพื่อส่งผลิต</p>
        <h3>เตรียมการผลิต</h3>
        <div class="image-illustration">
          <img
            src="./images/production/pre-manufacturing.png"
            alt="pre-manufacturing"
          />
        </div>
        <p class="image-caption">Figure 1: Pre manufacturing page</p>
        <h4>ส่วนประกอบหลักของหน้า</h4>
        <ul>
          <li>
            ปุ่ม + เพิ่มกลุ่ม: ใช้สร้างกลุ่มสินค้าใหม่ เพื่อรวม PO
            เข้ากลุ่มผลิตเดียวกัน
          </li>
          <li>
            ช่องค้นหา: ค้นหารายการ PO หรือรหัสสินค้าในแต่ละส่วน (จัดกลุ่มแล้ว /
            ไม่ได้จัดกลุ่ม)
          </li>
          <li>
            ปุ่มเครื่องมือ:
            ใช้เข้าไปจัดการรายละเอียดของคำสั่งผลิตนั้นเพื่อเริ่มสั่งผลิต เช่น
            แก้จำนวน, เลือกวัตถุดิบ, สร้าง layout
          </li>
          <li>
            สถานะจุดสี:
            <ul>
              <li>จุดสีแดง - วงกลมเปล่า: ไม่มีงานก่อนหน้า</li>
              <li>จุดสีแดง - วงกลมทึบ: มีงานก่อนหน้าแล้ว</li>
              <li>จุดสีเขียว - วงกลมเปล่า: เป็นงานเดิม</li>
              <li>จุดสีเขียว - วงกลมทึบ: เป็นงานใหม่</li>
            </ul>
          </li>
        </ul>

        <h3 id="producing">เริ่มสั่งผลิต</h3>
        <div class="image-illustration">
          <img src="./images/production/producing.png" alt="producing" />
        </div>
        <p class="image-caption">Figure 2: Producing page</p>
        <h4>ส่วนประกอบหลัก</h4>
        <h5>ด้านบน</h5>
        <ul>
          <li>ลูกค้าสั่งผลิต: จำนวนสินค้าที่ลูกค้าสั่ง</li>
          <li>ชิ้นงานคงคลัง: จำนวนที่มีอยู่ในคลัง</li>
          <li>ต้องสั่งผลิต: จำนวนที่ระบบคำนวณให้ต้องผลิตเพิ่มเติม</li>
          <li>ใบพิมพ์เผื่อเสียตั้งต้น: จำนวนใบพิมพ์ที่เผื่อไว้เบื้องต้น</li>
          <li>
            ใบพิมพ์ที่ก่อนรวมเผื่อเสีย: จำนวนใบพิมพ์ที่ได้รวมเผื่อเสียแล้ว
          </li>
          <li>ใบพิมพ์ผลิตจริง: จำนวนใบพิมพ์ที่ใช้จริง</li>
          <li>บริษัท: ชื่อบริษัทผู้ผลิต</li>
          <li>งาน: ประเภทงาน ได้แก่ ด่วน และปกติ</li>
        </ul>
        <h5>ส่วนแสดงภาพแบบการตัด</h5>
        <p>แสดงแผนภาพการจัดวางการตัดวัสดุลงบนแผ่นงาน</p>
        <h5>รายละเอียดวัตถุดิบและการตัด</h5>
        <ul>
          <li>วัตถุดิบ: ประเภทวัสดุ เช่น กล่องแป้ง DBE 350g</li>
          <li>คลังผู้จำหน่าย / คลัง KSP: จำนวนวัสดุในแต่ละคลัง</li>
          <li>รูปแบบการตัด: เช่น วางแนวนอน 1 แถวบน</li>
          <li>วัตถุดิบที่ใช้: จำนวนรีมหรือแผ่นที่ใช้จริง</li>
          <li>ชิ้นงานผลิต: จำนวนที่ผลิต</li>
          <li>ใบพิมพ์: จำนวนใบพิมพ์ที่ใช้</li>
          <li>ขนาด: ขนาดแผ่นงานที่ใช้</li>
          <li>ประสิทธิภาพ: คำนวณจากพื้นที่ใช้งานจริง เทียบกับทั้งหมด</li>
          <li>Cavity: จำนวนชิ้นงานต่อ 1 ใบพิมพ์</li>
        </ul>

        <h3>สร้างแบบและสั่งผลิต</h3>
        <div class="image-illustration">
          <img src="./images/production/layout-to-produce.png" alt="layout-to-produce" />
        </div>
        <p class="image-caption">Figure 3: Layout to produce page</p>

        <h3>เสร็จสิ้นการผลิต</h3>
        <div class="image-illustration">
          <img src="./images/production/production-completed.png" alt="production-completed" />
        </div>
        <p class="image-caption">Figure 4: Production completed page</p>
      </div>

      <div class="content-section">
        <h2 id="daily-plan">แผนผลิตประจำวัน</h2>
        <p>แผนผลิตประจำวัน (Daily Production Plan)</p>
        <h3>กำหนดเครื่องจักร</h3>
        <div class="image-illustration">
          <img src="./images/production/daily-plan-machine.png" alt="daily-plan-machine" />
        </div>
        <p class="image-caption">Figure 5: Daily plan define machine page</p>
        <p>เลือกเครื่องจักรของขั้นตอนต่างๆ แล้วกดปุ่มสร้าง หรือกดปุ่มสร้างทันที (สามารถกำหนดได้ภายหลัง)</p>

        <h3>ปรับตั้งค่าการผลิต</h3>
        <div class="image-illustration">
          <img src="./images/production/daily-plan-config.png" alt="daily-plan-config" />
        </div>
        <p class="image-caption">Figure 6: Daily plan configuration page</p>
        <p>กดเลือกสินค้า เพื่อปรับตั้งค่าการผลิต โดยจะแสดง modal แก้ไขแผนผลิตประจำวัน</p>
        <h4>แก้ไขแผนผลิตประจำวัน</h4>
        <div class="image-illustration">
          <img src="./images/production/daily-plan-edit.png" alt="daily-plan-edit" />
        </div>
        <p class="image-caption">Figure 7: Edit daily plan page</p>
        <p>สามารถแก้ไขเครื่องจักร และเพิ่มหมายเหตุได้ เมื่อแก้ไขแล้วจึงกดปุ่มบันทึก</p>

        <h3>กำหนดแผนการผลิต</h3>
        <div class="image-illustration">
          <img src="./images/production/daily-plan-production.png" alt="daily-plan-production" />
        </div>
        <p class="image-caption">Figure 8: Daily plan production all plan</p>
        <p>แสดงตารางรายการของแผนทั้งหมด สามารถเลือกกำหนดวันของแต่ละงานได้</p>
        <div class="image-illustration">
          <img src="./images/production/daily-plan-production-date.png" alt="daily-plan-production-date" />
        </div>
        <p class="image-caption">Figure 9: Daily plan production defined plan</p>
        <p>แสดงตารางรายการของแผนที่กำหนดวันแล้ว สามารถแก้ไขวันของแต่ละงานได้</p>

        <h3>สินค้าและการจัดส่ง</h3>
        <div class="image-illustration">
          <img src="./images/production/product-and-delivery.png" alt="product-and-delivery" />
        </div>
        <p class="image-caption">Figure 10: Product and delivery</p>
        <p>แสดงตารางรายการของสินค้าที่ผลิตเสร็จสิ้น กดปุ่มสีฟ้าเพื่อรับสินค้าเข้าคลัง และกดปุ่มสีเหลืองเพื่อส่งสินค้าให้ลูกค้า</p>
      </div>

      <div class="content-section">
        <h2 id="operation-plan">รายการผลิต</h2>
        <p>รายการผลิต (operator)</p>
        <div class="image-illustration">
          <img src="./images/production/oparetion-plan.png" alt="oparetion-plan" />
        </div>
        <p class="image-caption">Figure 11: Operation plan</p>
        <p>แสดงตารางรายการผลิตของงานต่างๆ โดยค่าเริ่มต้นจะแสดงรายการผลิตของวันปัจจุบัน</p>
        <h3>ใบปฏิบัติงาน</h3>
        <div class="image-illustration">
          <img src="./images/production/operation-document.png" alt="operation-document" />
        </div>
        <p class="image-caption">Figure 12: Operation document</p>
        <p>แสดงรายละเอียดของงานดังกล่าว กดปุ่มเริ่มการทำงาน เพื่อเข้าไปทำงาน</p>
        <div class="image-illustration">
          <img src="./images/production/operation-document-2.png" alt="operation-document-2" />
        </div>
        <p class="image-caption">Figure 13: Operation document form 2</p>
        <div class="image-illustration">
          <img src="./images/production/operation-document-3.png" alt="operation-document-3" />
        </div>
        <p class="image-caption">Figure 14: Operation document form 3</p>
        <div class="image-illustration">
          <img src="./images/production/operation-document-4.png" alt="operation-document-4" />
        </div>
        <p class="image-caption">Figure 15: Operation document form 4</p>
        <p>กรอกรายละเอียดในแต่ละฟอร์ม แล้วจึงกดปุ่มบันทึก หรือกดปุ่มเสร็จสิ้นทันที</p>
      </div>

      <div class="content-section">
        <h2 id="print-list">รายการพิมพ์สติ๊กเกอร์</h2>
        <p>รายละเอียดรูปแบบตารางการส่งออก</p>
      </div>

      <div class="content-section">
        <h2 id="outsource">รายการจัดจ้างภายนอก</h2>
        <p>แสดงรายการจัดจ้างภายนอก</p>
      </div>

      <div class="content-section">
        <h2 id="cutting-list">รายการสั่งงานตัด</h2>
        <p>รายการสั่งงานตัด</p>
        <div class="image-illustration">
          <img src="./images/production/cutting-list.png" alt="cutting-list" />
        </div>
        <p class="image-caption">Figure 16: Cutting list</p>
        <p>แสดงรายการสั่งตัดที่มีสถานะ Pending ถ้ารายการที่ต้องการได้ตรวจสอบแล้ว สามารถเข้าไปตัดได้ ถ้ายังไม่ได้ตรวขสอบ ให้กดเลือกแบทช์ และกดปุ่มรายการตรวจสอบ</p>
        <h3>รายการตรวจสอบ</h3>
        <div class="image-illustration">
          <img src="./images/production/check-list.png" alt="check-list" />
        </div>
        <p class="image-caption">Figure 17: Check list</p>
        <p>แสดงรายการที่ต้องตรวจสอบ เลือก Passed หรือ Failed และกดปุ่มที่ต้องการ</p>
        <h3>รายละเอียดของรายการสั่งงานตัด</h3>
        <div class="image-illustration">
          <img src="./images/production/cutting-list-detail.png" alt="cutting-list-detail" />
        </div>
        <p class="image-caption">Figure 18: Cutting list detail</p>
        <p>กดปุ่มยืนยันงานตัดในแต่ละ layout เมื่อตัดแล้วทั้งหมด จึงจะสามารถกดปุ่มปิดงานได้</p>
        <h3>รายการสั่งงานตัดเสร็จสิ้น</h3>
        <div class="image-illustration">
          <img src="./images/production/cutting-list-submitted.png" alt="cutting-list-submitted" />
        </div>
        <p class="image-caption">Figure 19: Cutting list submitted</p>
        <p>แสดงรายการงานตัดที่เสร็จสิ้นแล้ว</p>
      </div>
    </template>
  </body>
</html>
